<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent_Eval 复核{% endblock %}</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/bundle.css">
</head>
<body class="rv-app">
<header class="rv-header">
  <span class="rv-brand">Agent_Eval 复核</span>
  <nav class="rv-nav" aria-label="视图">
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>用例</a>
    <a href="/review" {% if request.url.path.startswith('/review') %}aria-current="page"{% endif %}>复核
      {% if nav_count %}<span class="rv-count" data-tone="notice">{{ nav_count }}</span>{% endif %}</a>
    <a href="/compare" {% if request.url.path == '/compare' %}aria-current="page"{% endif %}>结果对比</a>
    <a href="/judging" {% if request.url.path == '/judging' %}aria-current="page"{% endif %}>判定质量</a>
  </nav>
  <label class="rv-judge">判定配置
    <select class="rv-select" onchange="var u=new URL(location);if(this.value)u.searchParams.set('chain',this.value);else u.searchParams.delete('chain');location=u">
      {% for ch in chains %}
      <option value="{{ ch.chain_sha }}" {% if ch.chain_sha == chain_sha %}selected{% endif %}>
        {{ ch.name or '未命名' }} · {{ ch.chain_sha[:8] }}{% if ch.judge_models %}（判定模型 {{ ch.judge_models|join('、') }}）{% endif %}</option>
      {% endfor %}
    </select>
  </label>
</header>
{% block body %}{% endblock %}
<script src="/static/highlight.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
