<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Agent_Eval 复核{% endblock %}</title>
<script>try{var t=localStorage.getItem('rv-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/bundle.css">
</head>
<body class="rv-app">
  <aside class="rv-header">
    <span class="rv-brand">Agent_Eval 复核</span>
    <nav class="rv-nav" aria-label="视图">
      <a href="/" {% if request.url.path == '/' or request.url.path.startswith('/case/new') %}aria-current="page"{% endif %}>用例管理</a>
      <a href="/configs" {% if request.url.path.startswith('/configs') %}aria-current="page"{% endif %}>配置管理</a>
      <a href="/runs" {% if request.url.path.startswith('/runs') %}aria-current="page"{% endif %}>执行记录</a>
      <a href="/review" {% if request.url.path.startswith('/review') %}aria-current="page"{% endif %}>复核
        {% if nav_count %}<span class="rv-count" data-tone="notice">{{ nav_count }}</span>{% endif %}</a>
      <a href="/compare" {% if request.url.path == '/compare' %}aria-current="page"{% endif %}>结果对比</a>
      <a href="/judging" {% if request.url.path == '/judging' %}aria-current="page"{% endif %}>判定质量</a>
    </nav>
    <div class="rv-header-tools">
      <div class="rv-judge">
        <span class="rv-judge-k">判定配置</span>
        <span class="rv-judge-row">
        <select class="rv-select" id="chain-select" data-chain="{{ chain_sha }}" onchange="var u=new URL(location);if(this.value)u.searchParams.set('chain',this.value);else u.searchParams.delete('chain');location=u">
          {% for ch in chains %}
          <option value="{{ ch.chain_sha }}" data-name="{{ ch.name or '' }}" {% if ch.chain_sha == chain_sha %}selected{% endif %}>
            {{ ch.name or '未命名' }} · {{ ch.chain_sha[:8] }}{% if ch.judge_models %}（判定模型 {{ ch.judge_models|join('、') }}）{% endif %}</option>
          {% endfor %}
        </select>
        <button class="rv-icon-btn" type="button" id="chain-name-btn" title="重命名当前判定配置" aria-label="重命名判定配置">✎</button>
        </span>
      </div>
      <div class="rv-theme" role="group" aria-label="配色方案" data-theme-toggle>
        <button type="button" data-theme-opt="light" aria-pressed="false" aria-label="浅色" title="浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-opt="dark" aria-pressed="false" aria-label="深色" title="深色">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" data-theme-opt="system" aria-pressed="true" aria-label="跟随系统" title="跟随系统">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="rv-main">
  {% if needs_rescore %}
  <div class="rv-notice" data-tone="error" style="margin:12px 24px 0"><b>当前口径下还没有会话结论</b>
    <span>改口径（policy）后需重算一次会话分，不调用算子：</span>
    <span class="rv-cmd">python -m scoring rescore<button type="button">复制</button></span></div>
  {% endif %}
  {% block body %}{% endblock %}
  </div>
<script src="/static/highlight.js"></script>
<script src="/static/theme.js"></script>
<script src="/static/rename.js"></script>
<script>
  rvRename({ btn: document.getElementById('chain-name-btn'), host: document.getElementById('chain-select'),
    getId: function () { return document.getElementById('chain-select').dataset.chain; },
    getLabel: function () { var s = document.getElementById('chain-select');
      return s.selectedOptions[0] ? (s.selectedOptions[0].dataset.name || '') : ''; },
    url: '/api/chain/rename', key: 'chain_sha', field: 'name',
    placeholder: '如 规则+llm-v2（空 = 未命名）' });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
