# 计分规则（doc/15 §3.3 + doc/17 §6）。改这里只需 rescore：只读逐条判定重算，不调算子。
# doc/17 起：条目是否计分由条目用途决定（md 的【计分】/【参考】，缺省见 items.NODES），
# 不再按 kind 写死；否决是固定的默认规则，方式全局唯一（veto_mode），veto.* 逐项配置删除。
# rules_sha 按规范化内容计算（本文件注释/空白不影响）。
schema: 1
undecided: exclude          # 会话分区间跨过及格线（有未决条目）的会话：exclude 不计入 / fail 记失败
operator_score: adopt       # adopt：采信模型算子/人工显式分 | ignore：只用 map 快捷分值
score:
  pass_mark: 60             # 通过 = 会话分 ≥ 及格线
  map:                      # 结论词 → 快捷分值（显式分仅在 operator_score=adopt 且必要/期望事实时采信）
    对: 100
    部分: 50
    未提及: 0
    错: 0
    满足: 100
    违反: 0
    成立: 100               # 前提可计分（doc/17 §6.1）：成立 100 / 不成立 0
    不成立: 0
    未采信: 100
    采信: 0
    拒答: 100
    未拒答: 0
  veto_mode: zero           # 否决方式全局唯一（doc/17 §6.2）：zero 会话分记 0 | cap 不超过 score.cap
  cap: 40                   # veto_mode=cap 时的封顶分
aggregate:
  scored_rewrites_exclude: [诱导]   # 这些改写方式的变体不计入维度分（题组一致性同样不计）
  dimension_unit: case              # 维度分：case 先在用例内平均、用例等权 | question 题目等权
  dimensions:                       # 综合分的维度权重（未列出的维度为 1）
    知识召回: 1
    多轮上下文召回: 1
    同义请求一致性: 1
    错误知识纠正: 1
group: max                  # 固定规则，仅作说明：组分取组内最高分、组权重取最大
