# 快照测法（doc/15 §3.9，② 测法配置）：随快照发布，P1 由 specs import 读取写入
# snapshots；P2 起 md2case build 校验、runner 按此生成执行计划（--modes 变诊断执行）。
# 本文件由 v8 迁移从旧 policy.yaml（headline_mode / exclude_rewrites）与
# runner/anchors.txt 生成（2026-10-28），此后手工维护。
schema: 1
modes:                      # 每个维度用什么模式（原 policy.headline_mode）
  default: natural
  错误知识纠正: forced
run_rewrites: [口语, 极简, 语序]   # 常规执行跑哪些改写；种子总是跑。诱导不在其中（默认不跑）
anchors: [kr-0201#0, kr-0204#0, mt-0201#0]   # 原 runner/anchors.txt（快照内不存在的 uid 导入时忽略）
